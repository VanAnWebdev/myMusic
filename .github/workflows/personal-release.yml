# Builds the personal Android APK on every push to main (or by hand from the Actions tab) and
# publishes it as a GitHub Release of THIS repo. Phones running an earlier build of this repo see
# the update on their next launch (androidApp/.../update/ForkUpdater.kt reads this repo's Releases).
#
# Needs four repository secrets (Settings → Secrets and variables → Actions):
#   BAO_KEYSTORE_BASE64    the keystore file, base64-encoded
#   BAO_KEYSTORE_PASSWORD  the keystore's password
#   BAO_KEY_ALIAS          the key's alias
#   BAO_KEY_PASSWORD       the key's password
# Always the same key: Android only installs an update signed with the key of the installed app.
name: Personal release (Android)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'scripts/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: write

concurrency:
  group: personal-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.BAO_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.BAO_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.BAO_KEY_ALIAS }}
          KP: ${{ secrets.BAO_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KSP" ] || [ -z "$KA" ] || [ -z "$KP" ]; then
            echo "::error::Signing secrets are missing. Add BAO_KEYSTORE_BASE64, BAO_KEYSTORE_PASSWORD, BAO_KEY_ALIAS and BAO_KEY_PASSWORD under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          BAO_KEYSTORE_BASE64: ${{ secrets.BAO_KEYSTORE_BASE64 }}
          BAO_KEYSTORE_PASSWORD: ${{ secrets.BAO_KEYSTORE_PASSWORD }}
          BAO_KEY_ALIAS: ${{ secrets.BAO_KEY_ALIAS }}
          BAO_KEY_PASSWORD: ${{ secrets.BAO_KEY_PASSWORD }}
          UPDATE_REPO: ${{ github.repository }}
        run: |
          echo "$BAO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export BAO_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon :androidApp:assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit_time=$(git log -1 --format=%ct)
          tag="bao-$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          out=androidApp/build/outputs/apk/release
          mkdir -p dist
          cp "$out/androidApp-arm64-v8a-release.apk" "dist/NhacNheo-$tag-arm64-v8a.apk"
          cp "$out/androidApp-universal-release.apk" "dist/NhacNheo-$tag-universal.apk"
          # Same arm64 APK under a fixed name: .../releases/latest/download/NhacNheo-arm64-v8a.apk
          cp "$out/androidApp-arm64-v8a-release.apk" "dist/NhacNheo-arm64-v8a.apk"
          gh release create "$tag" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "$tag — $(git log -1 --format=%s | cut -c1-80)" \
            --notes "Personal build of commit ${GITHUB_SHA}.

          commit-time: ${commit_time}

          Most phones want \`arm64-v8a\`; \`universal\` works on any phone but is larger.

          GPL-3.0. Source: this repository at ${GITHUB_SHA}. Based on Nhạc Nhẽo by baotrq (github.com/baotrq/project-2b, github.com/baotrq/core), itself a fork of SimpMusic by maxrave-dev and contributors."
